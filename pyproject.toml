[project]
name = "phera-demo"
version = "0.1.0"
description = "Synthetic-data demo: smartphone colorimetric pH reading with colour calibration, conformal uncertainty and Bayesian personal baselines"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "gradio>=4.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phera"]
